name: Deploy planner.captechvn.com

# Build on GitHub-hosted runners (the 192.168.1.253 host has too little RAM for the
# Angular prod build), then deploy on a self-hosted runner that lives on that host.
on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-planner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and push planner image to GHCR
    if: github.repository == 'chauanphu/super-productivity'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
        with:
          images: ghcr.io/chauanphu/planner
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: packages/super-sync-server/Dockerfile
          # Server + Angular app on one origin (no UNSPLASH_* args: this target does not use them)
          target: planner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILDKIT_CONTEXT_KEEP_GIT_DIR=1
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the planner stack (planner-db + planner-app) in ~/e-web/planner. It deliberately
  # leaves the old static `super-productivity` container and ~/e-web/super-productivity alone:
  # NPM keeps forwarding to it until the owner points the planner.captechvn.com Proxy Host at
  # planner-app:1900. After that switch, clean up by hand once:
  #   cd ~/e-web/super-productivity && docker compose down && cd .. && rm -r super-productivity
  deploy:
    name: Deploy planner stack to 192.168.1.253 (~/e-web/planner)
    needs: build
    if: github.repository == 'chauanphu/super-productivity'
    runs-on: [self-hosted, linux, sp-deploy]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # .env (secrets) and backup.sh/crontab are managed by hand on the host; never touch them.
      - name: Install compose file
        run: |
          set -euo pipefail
          dir="$HOME/e-web/planner"
          mkdir -p "$dir"
          if [ ! -f "$dir/.env" ]; then
            echo "::error::$dir/.env is missing. Create it by hand on the host (see deploy/planner-stack/docker-compose.yml for the required keys); CI never creates it."
            exit 1
          fi
          cd "$dir"
          if [ -f docker-compose.yml ]; then
            cp docker-compose.yml "docker-compose.yml.bak-$(date +%Y%m%d-%H%M%S)"
            ls -1t docker-compose.yml.bak-* | tail -n +4 | xargs -r rm -f --
          fi
          cp "$GITHUB_WORKSPACE/deploy/planner-stack/docker-compose.yml" docker-compose.yml

      - name: Pull and start the stack
        run: |
          set -euo pipefail
          cd "$HOME/e-web/planner"
          docker compose pull planner-app
          docker compose up -d --remove-orphans
          docker image prune -f

      # Uses the image's HEALTHCHECK (wget /health, start period 30s, interval 30s).
      - name: Wait for planner-app to become healthy
        run: |
          set -euo pipefail
          status=unknown
          for _ in $(seq 1 90); do
            status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' planner-app || echo missing)
            if [ "$status" = "healthy" ]; then
              echo "planner-app is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::planner-app did not become healthy within 180s (last status: $status)"
          docker logs --tail 80 planner-app 2>&1 || true
          exit 1

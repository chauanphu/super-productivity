# planner.captechvn.com: SuperSync server + the Angular app on one origin, plus Postgres.
#
# Layout on 192.168.1.253 (~/e-web/planner):
#   docker-compose.yml  copied from this file by .github/workflows/deploy-planner.yml on every
#                       push to master (the previous copy is kept as docker-compose.yml.bak-*)
#   .env                secrets; lives ONLY on the host, never in git, never written by CI.
#                       Required keys: POSTGRES_USER, POSTGRES_DB, POSTGRES_PASSWORD, JWT_SECRET,
#                       PUBLIC_URL, CORS_ORIGINS, REGISTRATION_DISABLED, ALLOWED_EMAILS
#   backup.sh           daily pg_dump via cron (copy of deploy/planner-stack/backup.sh; CI never
#                       installs or overwrites it, nor the crontab)
#
# Image ghcr.io/chauanphu/planner is built by CI (`planner` target of
# packages/super-sync-server/Dockerfile); the host is too small to build the Angular app.
# No host ports are published: Nginx Proxy Manager forwards planner.captechvn.com to
# planner-app:1900 over the external nginx-network.
services:
  planner-db:
    image: postgres:16-alpine
    container_name: planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - planner-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks: [internal]

  planner-app:
    image: ghcr.io/chauanphu/planner:latest
    pull_policy: always
    container_name: planner-app
    restart: unless-stopped
    depends_on:
      planner-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@planner-db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
      REGISTRATION_DISABLED: ${REGISTRATION_DISABLED}
      WEB_ROOT: /app/web
      WEBAUTHN_RP_ID: planner.captechvn.com
      WEBAUTHN_ORIGIN: https://planner.captechvn.com
    volumes:
      - planner-data:/app/data
    # No security_opt no-new-privileges on purpose: with this host's kernel/AppArmor profile it
    # makes every exec fail (EPERM).
    labels:
      - com.centurylinklabs.watchtower.enable=false
    networks: [internal, nginx-network]

networks:
  internal:
  nginx-network:
    external: true

volumes:
  planner-db:
  planner-data:
